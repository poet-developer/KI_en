<h2>Close Reading</h2>
<h3>Explore individual poems and line-level emotions</h3>
<div class="author-buttons">
    <a href="close-kim-menu.html"><button class="author-btn active">Kim Sowol</button></a>
    <a href="close-yun-menu.html"><button class="author-btn">Yun Dong-ju</button></a>

<div class="poem-frame">
  <p class="poem-title">Mother, Sister</p>

  <p class="poem-line" id="line_1">엄마야 누나야 강변 살자,</p>
  <p class="poem-line" id="line_2">뜰에는 반짝는 금모래빛,</p>
  <p class="poem-line" id="line_3">뒷문 밖에는 갈잎의 노래</p>
  <p class="poem-line" id="line_4">엄마야 누나야 강변 살자.</p>
</div>

<!-- ✅ MODAL -->
<div id="modalOverlay" class="modal-overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <p id="modalTitle" class="modal-title">Line Detail</p>
      <button class="modal-close" id="modalCloseBtn" aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <p id="modalLineText" class="clicked-line"></p>
      <div class = "tag_contatiner"></div>
      <p class="hint">Click outside the dialog or press Esc to close.</p>
    </div>
  </div>
</div>

<script>
  const overlay = document.getElementById("modalOverlay");
  const modalLineText = document.getElementById("modalLineText");
  const closeBtn = document.getElementById("modalCloseBtn");

  function openModal(line) {
    const english = line.querySelector(".poem-line-en")?.textContent.trim() || line.textContent.trim();
    const korean = line.querySelector(".poem-line-ko")?.textContent.trim() || "";
    modalLineText.replaceChildren();

    const englishLine = document.createElement("span");
    englishLine.className = "modal-line-en";
    englishLine.textContent = english;
    modalLineText.appendChild(englishLine);

    if (korean) {
      const koreanLine = document.createElement("span");
      koreanLine.className = "modal-line-ko";
      koreanLine.lang = "ko";
      koreanLine.textContent = korean;
      modalLineText.appendChild(koreanLine);
    }

    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden"; // 스크롤 잠금
  }

  function closeModal() {
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    document.body.style.overflow = ""; // 스크롤 복구
  }

  // ✅ 각 poem-line 클릭 시 모달 열기
  document.querySelectorAll(".poem-line").forEach(line => {
    line.addEventListener("click", () => {
      openModal(line);
    });
  });

  // ✅ Close 버튼
  closeBtn.addEventListener("click", closeModal);

  // ✅ 배경(오버레이) 클릭 시 Close (모달 박스 클릭은 제외)
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) closeModal();
  });

  // ✅ ESC로 Close
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && overlay.classList.contains("open")) {
      closeModal();
    }
  });

const emotionDummyData = {

line_1: {
  annotator_01: ["Anticipation", "Welcome / Favor", "Affection", "None"],
  annotator_02: ["Anticipation", "Welcome / Favor", "Affection", "Enjoyment / Excitement"],
  annotator_03: ["Anticipation", "Joy"],
  annotator_04: ["Anticipation", "Affection", "Comfort / Ease", "Happiness"],
  annotator_05: ["Anticipation", "Joy", "Complaint / Dissatisfaction", "Comfort / Ease"]
},

line_2: {
  annotator_01: ["Delight (Cuteness / Beauty)", "Wonder / Interest", "None"],
  annotator_02: ["Delight (Cuteness / Beauty)", "Joy", "Anticipation", "Affection", "Enjoyment / Excitement", "Comfort / Ease"],
  annotator_03: ["Anticipation", "Joy", "Wonder / Interest"],
  annotator_04: ["Being moved / Admiration", "Anticipation", "Joy", "Happiness", "Welcome / Favor"],
  annotator_05: ["Anticipation", "Joy", "Being moved / Admiration", "Welcome / Favor", "Delight (Cuteness / Beauty)"]
},

line_3: {
  annotator_01: ["Anticipation", "Wonder / Interest", "Delight (Cuteness / Beauty)"],
  annotator_02: ["Joy", "Affection", "Comfort / Ease", "Happiness"],
  annotator_03: ["Joy", "Wonder / Interest", "Delight (Cuteness / Beauty)"],
  annotator_04: ["Happiness", "Comfort / Ease", "Joy"],
  annotator_05: ["Anticipation", "Joy", "Delight (Cuteness / Beauty)"]
},

line_4: {
  annotator_01: ["Affection", "Anticipation", "Enjoyment / Excitement"],
  annotator_02: ["Anticipation", "Affection", "Enjoyment / Excitement"],
  annotator_03: ["Being moved / Admiration", "Anticipation", "Joy"],
  annotator_04: ["Anticipation", "Affection", "Happiness", "Enjoyment / Excitement"],
  annotator_05: ["Joy", "Anticipation", "Affection", "Enjoyment / Excitement", "Happiness"]
}

};

  // ✅ 모달에 태그 추가
  function populateTags(lineId) {
    const tagContainer = document.querySelector(".tag_contatiner");
    tagContainer.innerHTML = ""; // 초기화

    const emotions = emotionDummyData[lineId];
    if (emotions) {
      for (const [annotator, tags] of Object.entries(emotions)) {
        const annotatorDiv = document.createElement("div");
        annotatorDiv.classList.add("annotator-tags");

        const annotatorTitle = document.createElement("h4");
        annotatorTitle.textContent = `${annotator}:`;
        annotatorDiv.appendChild(annotatorTitle);

        const tagList = document.createElement("div");
        tags.forEach(tag => {
          const tagItem = document.createElement("span");
          tagItem.classList.add("emotion-chip");  
          tagItem.id = tag;
          tagItem.textContent = tag;
          tagList.appendChild(tagItem);
        });
        annotatorDiv.appendChild(tagList);
        tagContainer.appendChild(annotatorDiv);
      }
    } else {
      tagContainer.textContent = "No emotion-tag data is available.";
    }
  }

  // ✅ 모달 열 때 태그 채우기
  document.querySelectorAll(".poem-line").forEach(line => {
    line.addEventListener("click", () => {
      populateTags(line.id);
    });
  });

</script>

<script src="../js/bilingual-poems.js"></script>
</body>
