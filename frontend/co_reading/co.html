<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Co-Reading Web Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../styles/header.css">
  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="stylesheet" href="../styles/co_style.css" />
</head>
<body>

  <header>
  <div class="logo"><a href="../../index.html">KPoEM</a></div>
  <nav>
    <!-- <a href="#" class="active">About</a> -->
    <a href="../close_reading/close-kim-menu.html">Close Reading</a>
    <a href="../distant_reading/distant-kim.html">Distant Reading</a>
    <a href="co.html">Co-Reading</a>
  </nav>
</header>
<div class="window-container">
<div>
<h2>Co-Reading</h2>
<h3>Read Together</h3>
</div>
    <div class="window-body">
      <label for="poemSelect">Select a Poem</label>
<select id="poemSelect" class="select-box">
  <option value="">Choose a poem</option>
  <option value="김소월01">Kim Sowol — Azaleas</option>
  <option value="윤동주01">Yun Dong-ju — Prologue</option>
  <option value="이상01">Yi Sang — Flowering Tree</option>
  <option value="임화01">Im Hwa — The Korea Strait (excerpt)</option>
  <option value="한용운01">Han Yong-un — The Ferryboat and the Traveler</option>
  <option value="신석정01">Shin Seok-jeong — In Your Eyes</option>
  <option value="백석01">Baek Seok — Me, Natasha, and the White Donkey (excerpt)</option>
  <option value="김수영01">Kim Su-young — The Blue Sky</option>
</select>

<label for="userText">Poem Text</label>
<textarea id="userText" readonly placeholder="Select a poem to display its full text."></textarea>
        <div class="button-row">
  <button id="analyzeButton">Read Together</button>
  <button id="analyzeResetButton">Clear</button>
</div>
      <div class="revealing-row">
        <span class="revealing-value" id="revealingValue">-</span>

        <!-- 분석중 모션 -->
        <span class="analyzing" id="analyzing">
          Reading
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </span>
      </div>

      <div class="gradient-box" id="gradientBox">
        <div class="gradient-fill" id="gradientFill"></div>
      </div>


      <div class="legend">
        <div class="legend-item">
          <div class="swatch" id="swatch1"></div>
          <div class="legend-text" id="legend1"></div>
        </div>
        <div class="legend-item">
          <div class="swatch" id="swatch2"></div>
          <div class="legend-text" id="legend2"></div>
        </div>
      </div>
    </div>
  </div>
</div>

  <script src="../js/app.js"></script>
